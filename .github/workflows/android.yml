name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        # setup-android@v3's default `packages` includes the obsolete `tools`
        # package, which no longer exists upstream ("Failed to find package
        # 'tools'", 2026-09-15). Override with exactly what compileSdk 34 needs.
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Run unit tests
        run: |
          chmod +x gradlew
          if ! ./gradlew testDebugUnitTest --info > /tmp/gradle-test.log 2>&1; then
            msg=$(grep -E "(^e: |FAILED|Exception:|AssertionError|Caused by:|What went wrong)" -A 3 /tmp/gradle-test.log | tail -n 60 | tr '\n' ' ' | cut -c1-3500)
            echo "::error title=GradleFailure::${msg}"
            cat /tmp/gradle-test.log
            exit 1
          fi
          cat /tmp/gradle-test.log

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        # Artifact retention is useful but must not hide a successful build when
        # the repository-level Actions storage quota is temporarily exhausted.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
